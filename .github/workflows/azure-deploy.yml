name: Deploy FlexiShift to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install all dependencies (dev + prod for build)
        run: npm install

      # GitHub secrets override .env when set. Empty secrets are not exported,
      # so a committed .env still works until secrets are added.
      - name: Build Vite SPA
        env:
          SECRET_SHEETS_URL: ${{ secrets.VITE_GOOGLE_SHEETS_WEBHOOK_URL }}
          SECRET_VERIFICATION_URL: ${{ secrets.VITE_GOOGLE_VERIFICATION_WEBHOOK_URL }}
          SECRET_SUBMIT_TOKEN: ${{ secrets.VITE_SUBMIT_TOKEN }}
          SECRET_BOOKING_URL: ${{ secrets.VITE_GOOGLE_VERIFICATION_BOOKING_URL }}
        run: |
          if [ -n "$SECRET_SHEETS_URL" ]; then export VITE_GOOGLE_SHEETS_WEBHOOK_URL="$SECRET_SHEETS_URL"; fi
          if [ -n "$SECRET_VERIFICATION_URL" ]; then export VITE_GOOGLE_VERIFICATION_WEBHOOK_URL="$SECRET_VERIFICATION_URL"; fi
          if [ -n "$SECRET_SUBMIT_TOKEN" ]; then export VITE_SUBMIT_TOKEN="$SECRET_SUBMIT_TOKEN"; fi
          if [ -n "$SECRET_BOOKING_URL" ]; then export VITE_GOOGLE_VERIFICATION_BOOKING_URL="$SECRET_BOOKING_URL"; fi
          npm run build

      - name: Install production dependencies only
        run: npm install --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
